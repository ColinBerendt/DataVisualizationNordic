<script>
const COLORS = {"happiness": {"Norway": "#b2d5b3", "Sweden": "#a7cca8", "Denmark": "#82af84", "Finland": "#538a56", "Iceland": "#82af84"}, "sunshine": {"Norway": "#86b288", "Sweden": "#39763e", "Denmark": "#5b905e", "Finland": "#37743b", "Iceland": "#99c19a"}, "ev": {"Norway": "#216326", "Sweden": "#609463", "Denmark": "#558c59", "Finland": "#679969", "Iceland": "#6fa072"}, "renewable": {"Norway": "#46804a", "Sweden": "#588e5b", "Denmark": "#88b48a", "Finland": "#7caa7e", "Iceland": "#3e7942"}};

const DATA = {"Norway": {"happiness": 7.24, "sunshine": 140, "ev": 96, "renewable": 76.7, "flag": "🇳🇴"}, "Sweden": {"happiness": 7.25, "sunshine": 160, "ev": 60, "renewable": 66.4, "flag": "🇸🇪"}, "Denmark": {"happiness": 7.54, "sunshine": 136, "ev": 66, "renewable": 43.7, "flag": "🇩🇰"}, "Finland": {"happiness": 7.76, "sunshine": 153, "ev": 56, "renewable": 50.8, "flag": "🇫🇮"}, "Iceland": {"happiness": 7.54, "sunshine": 111,  "ev": 51, "renewable": 80.9, "flag": "🇮🇸"}};

const INDICATORS = {
  happiness: {label:'😊 Happiness Score', unit:'/ 10', decimals:2},
  sunshine:  {label:'☀️ Average Sunshine Hours',  unit:'h/yr', decimals:0},
  ev:        {label:'⚡ Electric Vehicle Share',         unit:'%',    decimals:0},
  renewable: {label:'🌿 Renewable Energy Consumption', unit:'%',    decimals:1},
};

let currentInd = 'happiness';
// Globaler Speicher für die Karten-Layer der Länder
let mapLayers = {};

function fmt(val, ind) {
  const d = INDICATORS[ind].decimals;
  return d > 0 ? val.toFixed(d) : Math.round(val);
}

function updateSidebar() {
  const ind = INDICATORS[currentInd];
  const entries = Object.entries(DATA).sort((a,b) => b[1][currentInd] - a[1][currentInd]);
  const maxVal = Math.max(...entries.map(([,d]) => d[currentInd]));
  const minVal = Math.min(...entries.map(([,d]) => d[currentInd]));

  entries.forEach(([name, d]) => {
    const val = d[currentInd];
    const pct = maxVal === minVal ? 100 : ((val - minVal) / (maxVal - minVal) * 100).toFixed(0);
    const sivEl = document.getElementById('siv-' + name);
    const sibEl = document.getElementById('sib-' + name);
    if (sivEl) sivEl.textContent = fmt(val, currentInd) + ' ' + ind.unit;
    if (sibEl) sibEl.style.width = pct + '%';
    const siEl = document.getElementById('si-' + name);
    if (siEl) document.getElementById('sidebar-list').appendChild(siEl);
  });

  document.getElementById('cb-high').textContent = fmt(maxVal, currentInd) + ' ' + INDICATORS[currentInd].unit;
  document.getElementById('cb-low').textContent  = fmt(minVal, currentInd) + ' ' + INDICATORS[currentInd].unit;
  document.getElementById('cb-mid').textContent  = fmt((maxVal+minVal)/2, currentInd);
  document.getElementById('colorbar-label').textContent = ind.label;
  document.getElementById('map-title-main').textContent = ind.label + ' in Nordic Countries, 2025';
}

function setIndicator(ind) {
  currentInd = ind;
  document.querySelectorAll('.ind-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('[data-ind="' + ind + '"]').classList.add('active');
  updateSidebar();

  // Map korrekt über Leaflets API neu einfärben
  Object.keys(mapLayers).forEach(name => {
    if (COLORS[ind] && COLORS[ind][name]) {
      mapLayers[name].setStyle({
        fillColor: COLORS[ind][name]
      });
    }
  });
}

function selectCountry(name, triggerMapClick = false) {
  document.querySelectorAll('.si').forEach(s => s.classList.remove('active'));
  const el = document.getElementById('si-' + name);
  if (el) el.classList.add('active');

  if (triggerMapClick && mapLayers[name]) {
    mapLayers[name].openPopup();
  }
}
</script>

        geojsonObj.on({

        geojsonObj.bindTooltip(`<div style="font-family:'Segoe UI',sans-serif;font-size:13px"><b>${countryName}</b> · Click for details</div>`, {"sticky": true});
        
        // Popup wird hier dynamisch vor dem Öffnen befüllt
        let popup = L.popup({"maxWidth": 300});
        geojsonObj.bindPopup(popup);
        geojsonObj.on('popupopen', function() {
            popup.setContent(generateDynamicPopupHtml(countryName));
        });

        mapLayers[countryName] = geojsonObj; // Speichern für dynamisches Einfärben
